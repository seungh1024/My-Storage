name: SonarCloud

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Pre-pull test container images
        run: |
          set -euo pipefail
          pull_with_retry() {
            image="$1"
            max_attempts=3
            for attempt in $(seq 1 "$max_attempts"); do
              if docker pull "$image"; then
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 3))
              fi
            done
            echo "Failed to pull image: $image"
            exit 1
          }

          pull_with_retry mysql:8.0.33
          pull_with_retry redis:7
          pull_with_retry rabbitmq:3.12-management

      - name: Ensure Docker daemon is ready
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if docker info > /dev/null 2>&1; then
              echo "Docker daemon is ready"
              break
            fi
            echo "Waiting for Docker daemon... ($i/10)"
            sleep 3
          done
          docker info

      - name: Create application-secret.yml
        env:
          APPLICATION_SECRET_YML_B64: ${{ secrets.APPLICATION_SECRET_YML_B64 }}
        run: |
          if [ -z "$APPLICATION_SECRET_YML_B64" ]; then
            echo "Missing secret: APPLICATION_SECRET_YML_B64"
            exit 1
          fi
          mkdir -p src/main/resources
          printf '%s' "$APPLICATION_SECRET_YML_B64" | base64 -d > src/main/resources/application-secret.yml

      - name: Test + JaCoCo + Sonar analyze
        env:
          SPRING_PROFILES_ACTIVE: test,secret
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test jacocoTestReport sonar --info

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
